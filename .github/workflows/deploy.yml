name: Deploy TechBros Portfolio to DirectAdmin (FTP)

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  ftp-deploy:
    name: Sync to DirectAdmin FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # When we modernize the portfolio (e.g., Vite / Next static export / Astro / PHP),
      # we can add a build step here if needed.

      - name: Deploy files via FTPS/FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agents/**
            **/node_modules/**
            **/_backups/**
            **/.env*
            README.md
